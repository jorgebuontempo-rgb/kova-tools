<head>
<meta charset="UTF-8">

<title>Kovaba — Generar BAT importación</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", sans-serif; background: #f5f4f2; color: #1a1a1a; padding-bottom: 80px; }
  header { background: #1a1a1a; color: white; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; font-weight: 600; }
  .header-stats { font-size: 13px; color: #aaa; }
  .header-stats b { color: white; }
  .toolbar { background: white; border-bottom: 1px solid #eee; padding: 12px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; position: sticky; top: 0; z-index: 10; }
  .toolbar input[type=text] { flex: 1; min-width: 180px; padding: 8px 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 13px; outline: none; }
  .toolbar input[type=text]:focus { border-color: #1a1a1a; }
  .toolbar select { padding: 8px 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 13px; outline: none; background: white; }
  .btn-sm { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid #1a1a1a; background: white; color: #1a1a1a; white-space: nowrap; }
  .btn-sm:hover { background: #f0f0f0; }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .cat-section { margin-bottom: 24px; }
  .cat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .cat-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #555; }
  .cat-count { font-size: 11px; color: #aaa; }
  .cat-sel-all { font-size: 11px; color: #1565c0; cursor: pointer; margin-left: auto; font-weight: 600; }
  .cat-sel-all:hover { text-decoration: underline; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .prod-card { background: white; border-radius: 10px; padding: 12px 14px; border: 1.5px solid #eee; cursor: pointer; transition: all 0.12s; display: flex; align-items: flex-start; gap: 10px; }
  .prod-card:hover { border-color: #aaa; }
  .prod-card.selected { border-color: #2e7d32; background: #f1f8f1; }
  .prod-card input[type=checkbox] { width: 15px; height: 15px; margin-top: 2px; flex-shrink: 0; accent-color: #2e7d32; cursor: pointer; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-name { font-size: 12px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .prod-cat { font-size: 11px; color: #888; margin-top: 3px; }
  .prod-price { font-size: 11px; color: #555; margin-top: 2px; }
  .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .footer-info b { font-size: 22px; margin-right: 4px; }
  .footer-info small { color: #888; display: block; font-size: 11px; margin-top: 2px; }
  .btn-gen { background: #2e7d32; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-gen:hover { opacity: 0.85; }
  .btn-gen:disabled { opacity: 0.4; cursor: not-allowed; }
  .empty { text-align: center; padding: 40px; color: #aaa; }
</style>
</head>

function toggleCard(i) {
  estado[i] = !estado[i]; updateFooter();
  var card = document.querySelector('[data-idx="' + i + '"]');
  if (card) { card.className = estado[i] ? 'prod-card selected' : 'prod-card'; card.querySelector('input').checked = estado[i]; }
}
function updateFooter() {
  var n = estado.filter(Boolean).length;
  document.getElementById('footer-count').textContent = n;
  document.getElementById('hdr-sel').textContent = n;
  document.getElementById('btn-gen').disabled = n === 0;

function getVisible() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  var cat = document.getElementById('cat-filter').value;
  return productos.map(function(p, i) { return {p: p, i: i}; }).filter(function(x) {
    if (cat && x.p.categoria !== cat) return false;
    if (q && x.p.nombre.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}
function render() {
  var visible = getVisible();
  var byCat = {};
  visible.forEach(function(x) {
    if (!byCat[x.p.categoria]) byCat[x.p.categoria] = [];
    byCat[x.p.categoria].push(x);
  });
  var container = document.getElementById('main-container');
  container.innerHTML = '';
  if (!visible.length) { container.innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
  Object.keys(byCat).sort().forEach(function(cat) {
    var items = byCat[cat];
    var sec = document.createElement('div'); sec.className = 'cat-section';
    var hdr = document.createElement('div'); hdr.className = 'cat-header';
    var catEsc = cat.replace(/'/g, "\'");
    hdr.innerHTML = '<span class="cat-title">' + cat + '</span><span class="cat-count">' + items.length + '</span><span class="cat-sel-all" onclick="selCat(\'' + catEsc + '\',event)">Marcar todos</span>';
    sec.appendChild(hdr);
    var grid = document.createElement('div'); grid.className = 'grid';
    items.forEach(function(x) {
      var card = document.createElement('div');
      card.dataset.idx = x.i;
      card.className = estado[x.i] ? 'prod-card selected' : 'prod-card';
      card.innerHTML = '<input type="checkbox"' + (estado[x.i] ? ' checked' : '') + ' onclick="event.stopPropagation()"><div class="prod-info"><div class="prod-name">' + x.p.nombre + '</div><div class="prod-cat">' + x.p.categoria + '</div><div class="prod-price">$' + Math.round(x.p.precio).toLocaleString('es-AR') + '</div></div>';
      card.addEventListener('click', function() { toggleCard(x.i); });
      card.querySelector('input').addEventListener('click', function(e) { e.stopPropagation(); toggleCard(x.i); });
      grid.appendChild(card);
    });
    sec.appendChild(grid); container.appendChild(sec);
  });
  updateFooter();
}
function selCat(cat, e) {
  e.stopPropagation();
  var items = getVisible().filter(function(x) { return x.p.categoria === cat; });
  var allSel = items.every(function(x) { return estado[x.i]; });
  items.forEach(function(x) { estado[x.i] = !allSel; });
  render();
}
function toggleAll() {
  var visible = getVisible();
  var allSel = visible.every(function(x) { return estado[x.i]; });
  visible.forEach(function(x) { estado[x.i] = !allSel; });
  render();
}
function getCatId(cat) { return CATS[cat ? cat.trim() : ''] || null; }

async function obtenerVariantesGN(nombre) {
  try {
    var r = await fetch('https://www.gestionnube.com/api/v1/productos/obtener?q=' + encodeURIComponent(nombre) + '&per_page=5', {
      headers: { 'Authorization': 'Bearer ' + GN_TOKEN, 'Accept': 'application/json' }
    });
    if (!r.ok) return null;
    var data = await r.json();
    var prods = data.data || [];
    var prod = prods.find(function(p) { return p.name && p.name.toLowerCase().trim() === nombre.toLowerCase().trim(); }) || prods[0];
    if (!prod) return null;
    var r2 = await fetch('https://www.gestionnube.com/api/v1/productos/ver/' + prod.id + '?include_variants=1', {
      headers: { 'Authorization': 'Bearer ' + GN_TOKEN, 'Accept': 'application/json' }
    });
    if (!r2.ok) return null;
    var detail = await r2.json();
    return { id: prod.id, precio: prod.retailer_price, variantes: detail.variantes || [] };
  } catch(e) { return null; }
}

async function generarBAT() {
  var sel = productos.filter(function(_, i) { return estado[i]; });
  var btn = document.getElementById('btn-gen');
  btn.disabled = true;
  btn.textContent = 'Consultando GN...';
  var lines = ['@echo off', 'echo Importando ' + sel.length + ' productos a Tienda Nube...', ''];

  for (var idx = 0; idx < sel.length; idx++) {
    var p = sel[idx];
    btn.textContent = (idx+1) + '/' + sel.length + ' consultando GN...';
    var catId = getCatId(p.categoria);
    var nombre = p.nombre.replace(/"/g, "'").replace(/[<>|&%^]/g, '');
    var precio = (p.precio || 0).toFixed(2);
    var gnData = await obtenerVariantesGN(p.nombre);
    var variants = [];
    var attributes = null;
    if (gnData && gnData.variantes && gnData.variantes.length > 0) {
      var precioFinal = gnData.precio ? String(gnData.precio) : precio;
      attributes = [{"es": "Talle"}];
      variants = gnData.variantes.map(function(v) {
        var stockTotal = 0;
        if (v.stock_por_tienda) { v.stock_por_tienda.forEach(function(t) { stockTotal += t.stock_disponible || 0; }); }
        return { price: precioFinal, stock_management: true, stock: stockTotal, weight: "1.000", width: "30.00", height: "10.00", depth: "40.00", age_group: "adult", gender: "female", values: [{"es": String(v.size || v.size_name || v.size_id || 'Unico')}] };
      });
    } else {
      variants = [{ price: precio, stock_management: false, weight: "1.000", width: "30.00", height: "10.00", depth: "40.00", age_group: "adult", gender: "female" }];
    }
    var bodyObj = { name: { es: nombre }, variants: variants, published: false };
    if (catId) bodyObj.categories = [catId];
    if (attributes) bodyObj.attributes = attributes;
    var bodyStr = JSON.stringify(bodyObj).replace(/"/g, '\\"');
    lines.push('echo [' + (idx+1) + '/' + sel.length + '] ' + nombre);
    lines.push('curl -s -X POST "https://api.tiendanube.com/v1/5105207/products" -H "Authentication: bearer 64b106c5f6d08cee45a5720fa5e3d6f53327d171" -H "User-Agent: Kovaba Importer" -H "Content-Type: application/json" -d "' + bodyStr + '" > nul');
    if ((idx+1) % 10 === 0) lines.push('timeout /t 1 /nobreak > nul');
  }
  lines.push(''); lines.push('echo Listo! ' + sel.length + ' productos enviados.'); lines.push('pause');
  var blob = new Blob([lines.join('\r\n')], {type: 'application/octet-stream'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'importar-kovaba-' + new Date().toISOString().slice(0,10) + '.bat'; a.click();
  btn.textContent = 'Descargar BAT'; btn.disabled = false;
}
